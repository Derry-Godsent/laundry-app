<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chapman Prestige Limited">
  <!-- The mark used until the company logo is added to public/brand/logo.png.
       The letters are drawn as strokes rather than set in a font, so the mark
       is identical everywhere: in the app, in the browser tab, and on a home
       screen. scripts/make-brand-assets.mjs rasterises this file into the PNG
       sizes the manifest and iOS ask for. -->
  <rect width="512" height="512" rx="112" fill="#24506e" />
  <g transform="translate(256 256) scale(1.16) translate(-256 -256)"
     fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 168 A88 88 0 1 0 150 344" />
    <path d="M260 344 V168 H296 A44 44 0 0 1 296 256 H260" />
    <path d="M368 168 V344 H440" />
    </g>
</svg>
